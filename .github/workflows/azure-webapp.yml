name: Build and Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: aot-crm
  NODE_VERSION: 22.x

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next

          cp -r .next/static .next/standalone/.next/
          cp -r .next/server .next/standalone/.next/
          cp .next/BUILD_ID .next/standalone/.next/

          if [ -f .next/package.json ]; then
            cp .next/package.json .next/standalone/.next/
          fi

          if [ -d public ]; then
            cp -r public .next/standalone/
          fi

      - name: Verify Next.js build
        run: |
          echo "========== ROOT .NEXT =========="
          ls -la .next
          echo ""
          echo "========== STANDALONE =========="
          ls -la .next/standalone
          echo ""
          echo "========== STANDALONE .NEXT =========="
          ls -la .next/standalone/.next
          echo ""
          echo "========== BUILD_ID =========="
          cat .next/standalone/.next/BUILD_ID

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: .next/standalone
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app

      - name: Verify downloaded artifact
        run: |
          echo "========== DOWNLOADED FILES =========="
          ls -la
          echo ""
          echo "========== DOWNLOADED .NEXT =========="
          ls -la .next || true
          echo ""
          find . -maxdepth 3

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_19E666D9C43449E4AF84745F6509A2C8 }}